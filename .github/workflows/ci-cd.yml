name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

      - name: Copy Deployment Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "/home/${{ secrets.AWS_USERNAME }}/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e

            APP_DIR=/home/${{ secrets.AWS_USERNAME }}/app

            mkdir -p $APP_DIR
            cd $APP_DIR

            echo "===== Install Docker if Missing ====="

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt update
              sudo apt install -y ca-certificates curl gnupg lsb-release

              sudo install -m 0755 -d /etc/apt/keyrings

              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
              sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

              echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \
              $(. /etc/os-release && echo $VERSION_CODENAME) stable" | \
              sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt update

              sudo apt install -y \
                docker-ce \
                docker-ce-cli \
                containerd.io \
                docker-buildx-plugin \
                docker-compose-plugin

              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            echo "===== Docker Version ====="
            sudo docker --version
            sudo docker compose version

            echo "===== Docker Login ====="
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login \
              -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin

            echo "===== Pull Latest Images ====="
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/frontend:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest

            echo "===== Deploy ====="
            sudo docker compose down || true
            sudo docker compose up -d

            echo "===== Running Containers ====="
            sudo docker ps

            echo "===== Cleanup ====="
            sudo docker image prune -f
